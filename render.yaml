services:
  - type: web
    name: fellahalert
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fellahalert-db
          property: connectionString
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: fellahalert-db
    plan: free
